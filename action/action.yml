name: 'mysecrets'
description: 'Fetch secrets from your mysecrets backend and inject them into a command or the job environment.'

# When this action is referenced as `<you>/mysecrets-cli/action@<ref>`, GitHub
# checks out the entire mysecrets-cli repo at that ref. We then use the CLI
# sitting right next to this action.yml — no separate npm publish or
# `npm install -g github:...` step required.

inputs:
  token:
    description: 'mysecrets API token (sent as Authorization: Bearer)'
    required: true
  api-url:
    description: 'mysecrets backend base URL, e.g. https://your-mock.vercel.app'
    required: true
  secrets:
    description: |
      Newline-separated list of secret specs.
      Each line is `<id>:<envVar>[:value|file]`.
      Empty lines and lines starting with `#` are ignored.
      Example:
        firebase-sa:GOOGLE_APPLICATION_CREDENTIALS:file
        stripe-key:STRIPE_API_KEY
        # internal-token:INTERNAL_TOKEN   <- commented out
    required: true
  command:
    description: |
      Optional shell command to wrap. If provided, secrets are injected only
      for this command and (for file-type secrets) cleaned up afterwards.
      If omitted, secrets are exported to $GITHUB_ENV so all subsequent steps
      in the job see them. Note: $GITHUB_ENV does not support file-type secrets.
    required: false
    default: ''
  node-version:
    description: 'Node.js version to set up. Set to "skip" to use the runner default.'
    required: false
    default: '20'

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      if: ${{ inputs.node-version != 'skip' }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install CLI dependencies
      shell: bash
      working-directory: ${{ github.action_path }}/..
      run: npm install --omit=dev --no-audit --no-fund --silent

    - name: Fetch and inject secrets
      shell: bash
      env:
        MYSECRETS_TOKEN: ${{ inputs.token }}
        MYSECRETS_API_URL: ${{ inputs.api-url }}
        SECRETS_INPUT: ${{ inputs.secrets }}
        COMMAND: ${{ inputs.command }}
        CLI_PATH: ${{ github.action_path }}/../bin/mysecrets-cli
      run: |
        set -euo pipefail

        # Parse the newline-separated secret specs into a bash array of
        # `-s <spec>` arguments. Skip empty lines and comments.
        args=()
        while IFS= read -r line; do
          # Trim leading/trailing whitespace
          line="${line#"${line%%[![:space:]]*}"}"
          line="${line%"${line##*[![:space:]]}"}"
          [ -z "$line" ] && continue
          case "$line" in \#*) continue ;; esac
          args+=(-s "$line")
        done <<< "$SECRETS_INPUT"

        if [ "${#args[@]}" -eq 0 ]; then
          echo "::error::no valid secret specs in 'secrets' input"
          exit 1
        fi

        spec_count=$(( ${#args[@]} / 2 ))

        if [ -n "$COMMAND" ]; then
          echo "::group::Running command with $spec_count secret(s) injected"
          echo "Command: $COMMAND"
          # `bash -c "$COMMAND"` runs the user's command string through a shell,
          # so multi-word commands and shell features (&&, pipes, etc.) work.
          node "$CLI_PATH" run "${args[@]}" -- bash -c "$COMMAND"
          echo "::endgroup::"
        else
          echo "::group::Exporting $spec_count secret(s) to \$GITHUB_ENV"
          node "$CLI_PATH" export "${args[@]}" >> "$GITHUB_ENV"
          echo "Done. Subsequent steps will see these env vars."
          echo "::endgroup::"
        fi

branding:
  icon: 'lock'
  color: 'purple'
